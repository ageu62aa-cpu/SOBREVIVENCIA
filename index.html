<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Amazônia: Introdução</title>
    <!-- LINK CORRIGIDO E OFICIAL PARA CARREGAR O MOTOR 3D -->
    <script src="https://cloudflare.com"></script>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; font-family: monospace; background: #000; }
        canvas { display: block; image-rendering: pixelated; }
        #palpebras { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,1); transition: background 0.1s; pointer-events: none; z-index: 10; }
        #texto-introducao { position: absolute; bottom: 15%; width: 100%; text-align: center; color: #fff; font-size: 18px; font-weight: bold; text-shadow: 2px 2px #000; pointer-events: none; z-index: 11; }
    </style>
</head>
<body>
    <div id="palpebras"></div>
    <div id="texto-introducao">... ... ...</div>
    <script>
        // --- 1. CONFIGURAÇÃO DA CENA GRÁFICA ---
        const cena = new THREE.Scene();
        cena.background = new THREE.Color(0x0f1f0f);
        cena.fog = new THREE.FogExp2(0x0f1f0f, 0.08);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderizador = new THREE.WebGLRenderer({ antialias: false });
        renderizador.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderizador.domElement);

        const luzAvisada = new THREE.HemisphereLight(0xffffff, 0x444444, 1.0);
        cena.add(luzAvisada);

        camera.position.set(2, 0.8, -12);
        camera.rotation.set(0.3, 0, 0);

        // --- 2. CONSTRUÇÃO DO CENÁRIO ---
        const soloGeo = new THREE.PlaneGeometry(200, 200);
        const soloMat = new THREE.MeshBasicMaterial({ color: 0x1d140b });
        const solo = new THREE.Mesh(soloGeo, soloMat);
        solo.rotation.x = -Math.PI / 2;
        cena.add(solo);

        const aviaoGrupo = new THREE.Group();
        aviaoGrupo.position.set(2, 0, -14);

        const fuselagemGeo = new THREE.CylinderGeometry(1.5, 1.5, 7, 6);
        const metalMat = new THREE.MeshBasicMaterial({ color: 0x7c8c9c });
        const fuselagem = new THREE.Mesh(fuselagemGeo, metalMat);
        fuselagem.rotation.z = Math.PI / 2.3;
        fuselagem.position.y = 0.5;
        aviaoGrupo.add(fuselagem);

        const asaGeo = new THREE.BoxGeometry(6, 0.2, 2);
        const asa = new THREE.Mesh(asaGeo, metalMat);
        asa.position.set(-3, 1, -1);
        asa.rotation.y = 0.4;
        aviaoGrupo.add(asa);
        cena.add(aviaoGrupo);

        for (let i = 0; i < 35; i++) {
            let tx = (Math.random() * 100) - 50;
            let tz = (Math.random() * 100) - 50;
            if (tx > -5 && tx < 10 && tz > -18 && tz < -10) continue;

            const troncoGeo = new THREE.CylinderGeometry(0.3, 0.5, 8, 4);
            const troncoMat = new THREE.MeshBasicMaterial({ color: 0x3d2511 });
            const tronco = new THREE.Mesh(troncoGeo, troncoMat);
            tronco.position.set(tx, 4, tz);

            const copaGeo = new THREE.BoxGeometry(4, 4, 4);
            const copaMat = new THREE.MeshBasicMaterial({ color: 0x122e12 });
            const copa = new THREE.Mesh(copaGeo, copaMat);
            copa.position.set(tx, 7, tz);

            cena.add(tronco);
            cena.add(copa);
        }

        // --- 3. ANIMAÇÃO DE ACORDAR ---
        let tempoDecorrido = 0;

        function rodarLoop() {
            requestAnimationFrame(rodarLoop);
            tempoDecorrido += 0.016;

            if (tempoDecorrido < 3.5) {
                let pulsoPalpebra = Math.max(0, 1 - (tempoDecorrido / 3.5));
                document.getElementById('palpebras').style.background = `rgba(0,0,0,${pulsoPalpebra})`;
                document.getElementById('texto-introducao').innerText = "[Visão turva] Abrindo os olhos devagar...";
            } else {
                document.getElementById('palpebras').style.background = "rgba(0,0,0,0)";
                document.getElementById('texto-introducao').innerText = "Você acordou nos destroços do avião acidentado.";
                if(camera.rotation.x > 0) {
                    camera.rotation.x -= 0.002;
                }
            }
            renderizador.render(cena, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderizador.setSize(window.innerWidth, window.innerHeight);
        });

        rodarLoop();
    </script>
</body>
</html>
